components:
  schemas:
    AbsoluteLoadSpec:
      properties:
        kind:
          type: string
          const: absolute
          title: Kind
          default: absolute
      additionalProperties: false
      type: object
      title: AbsoluteLoadSpec
    ActiveWorkingSets:
      properties:
        min:
          type: integer
          maximum: 32767.0
          minimum: 0.0
          title: Min
        max:
          type: integer
          maximum: 32767.0
          minimum: 0.0
          title: Max
      additionalProperties: false
      type: object
      required:
      - min
      - max
      title: ActiveWorkingSets
    AnalysisDiagnostic:
      properties:
        code:
          type: string
          title: Code
        severity:
          $ref: '#/components/schemas/DiagnosticSeverity'
        message:
          type: string
          title: Message
        exercise_slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Exercise Slug
        affected_muscle_slugs:
          items:
            type: string
          type: array
          title: Affected Muscle Slugs
        affected_joint_slugs:
          items:
            type: string
          type: array
          title: Affected Joint Slugs
      additionalProperties: false
      type: object
      required:
      - code
      - severity
      - message
      title: AnalysisDiagnostic
    AnalysisModelParameters:
      properties:
        microcycle_days:
          type: integer
          minimum: 0.0
          title: Microcycle Days
        microcycle_hours:
          type: number
          minimum: 0.0
          title: Microcycle Hours
        microcycle_weeks:
          type: number
          minimum: 0.0
          title: Microcycle Weeks
        weekly_normalization_factor:
          type: number
          minimum: 0.0
          title: Weekly Normalization Factor
        effective_reps_by_rir:
          additionalProperties:
            type: number
          type: object
          title: Effective Reps By Rir
        rir_recovery_multiplier:
          additionalProperties:
            type: number
          type: object
          title: Rir Recovery Multiplier
        cumulative_set_penalty_step:
          type: number
          title: Cumulative Set Penalty Step
        cumulative_set_penalty_cap:
          type: number
          title: Cumulative Set Penalty Cap
        meaningful_contribution_epsilon:
          type: number
          title: Meaningful Contribution Epsilon
        recovery_convergence_epsilon_hours:
          type: number
          title: Recovery Convergence Epsilon Hours
        recovery_max_cycles:
          type: integer
          title: Recovery Max Cycles
        muscle_recovery_velocity_v1:
          type: number
          title: Muscle Recovery Velocity V1
        joint_recovery_velocity_v1:
          type: number
          title: Joint Recovery Velocity V1
      additionalProperties: false
      type: object
      required:
      - microcycle_days
      - microcycle_hours
      - microcycle_weeks
      - weekly_normalization_factor
      - effective_reps_by_rir
      - rir_recovery_multiplier
      - cumulative_set_penalty_step
      - cumulative_set_penalty_cap
      - meaningful_contribution_epsilon
      - recovery_convergence_epsilon_hours
      - recovery_max_cycles
      - muscle_recovery_velocity_v1
      - joint_recovery_velocity_v1
      title: AnalysisModelParameters
    AnalysisQueue:
      properties:
        as_of:
          type: string
          format: date
          title: As Of
        target_microcycle:
          anyOf:
          - $ref: '#/components/schemas/MicrocycleRef'
          - type: 'null'
        workouts:
          items:
            $ref: '#/components/schemas/QueueWorkout'
          type: array
          title: Workouts
      additionalProperties: false
      type: object
      required:
      - as_of
      - target_microcycle
      - workouts
      title: AnalysisQueue
    AnalysisReadiness:
      properties:
        target_microcycle_ordinal:
          anyOf:
          - type: integer
          - type: 'null'
          title: Target Microcycle Ordinal
        workouts:
          items:
            $ref: '#/components/schemas/AnalysisReadinessItem'
          type: array
          title: Workouts
      additionalProperties: false
      type: object
      required:
      - target_microcycle_ordinal
      - workouts
      title: AnalysisReadiness
    AnalysisReadinessItem:
      properties:
        workout_trace_id:
          type: integer
          title: Workout Trace Id
        workout_name:
          type: string
          title: Workout Name
        state:
