openapi: 3.1.0
info:
  title: Agonez Atlas API
  description: REST API for the Agonez exercise and muscle Atlas and the relational
    PlanCreator draft editor and the desktop Execution workflow API. Authentication
    and ownership are intentionally deferred.
  version: 0.1.0
paths:
  /assets/anatomy.svg:
    get:
      tags:
      - Atlas
      summary: Anatomy Asset
      operationId: anatomy_asset_assets_anatomy_svg_get
      responses:
        '200':
          description: Successful Response
        '404':
          description: Anatomy asset has not been installed
  /api/atlas/exercises:
    get:
      tags:
      - Atlas
      summary: List Exercises
      operationId: list_exercises_api_atlas_exercises_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 255
          - type: 'null'
          title: Q
      - name: body_part
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Body Part
      - name: target_category
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Target Category
      - name: mechanics_tier
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Mechanics Tier
      - name: resistance_source
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Resistance Source
      - name: sort
        in: query
        required: false
        schema:
          enum:
          - name
          - name_full
          - load_capacity
          - systemic_propulsive_fcsa_demand
          - created_at
          - updated_at
          type: string
          default: name
          title: Sort
      - name: order
        in: query
        required: false
        schema:
          enum:
          - asc
          - desc
          type: string
          default: asc
          title: Order
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Per Page
      - name: Accept-Language
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Accept-Language
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/atlas/exercises/catalog:
    get:
      tags:
      - Atlas
      summary: List Exercise Catalog
      operationId: list_exercise_catalog_api_atlas_exercises_catalog_get
      parameters:
      - name: Accept-Language
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Accept-Language
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseCatalogResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/atlas/exercises/{slug}:
    get:
      tags:
      - Atlas
      summary: Get Exercise
      operationId: get_exercise_api_atlas_exercises__slug__get
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[a-z0-9]+(?:_[a-z0-9]+)*$
          title: Slug
      - name: Accept-Language
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Accept-Language
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/atlas/exercises/{slug}/videos:
    post:
      tags:
      - Atlas
      summary: Add Exercise Video
      operationId: add_exercise_video_api_atlas_exercises__slug__videos_post
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[a-z0-9]+(?:_[a-z0-9]+)*$
          title: Slug
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExerciseVideoCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseVideoLinks'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/atlas/muscles:
    get:
      tags:
      - Atlas
      summary: List Muscles
      operationId: list_muscles_api_atlas_muscles_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 255
          - type: 'null'
          title: Q
      - name: body_part
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Body Part
      - name: complex
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Complex
      - name: sort
        in: query
        required: false
        schema:
          enum:
          - name
          - mass_g
          - mv_cm3
          - fiber_bias_type_ii
          - pcsa_fiber_cm2
          - pcsa_projected_fcsa_cm2
          type: string
          default: name
          title: Sort
      - name: order
        in: query
        required: false
        schema:
          enum:
          - asc
          - desc
          type: string
          default: asc
          title: Order
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Per Page
      - name: Accept-Language
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Accept-Language
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MuscleListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/atlas/muscles/{slug}/exercises:
    get:
      tags:
      - Atlas
      summary: Get Related Exercises
      operationId: get_related_exercises_api_atlas_muscles__slug__exercises_get
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[a-z0-9]+(?:_[a-z0-9]+)*$
          title: Slug
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 8
          title: Limit
      - name: sort
        in: query
        required: false
        schema:
          enum:
          - etu
          - name
          type: string
          default: etu
          title: Sort
      - name: Accept-Language
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Accept-Language
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelatedExerciseResponse'
        '422':
          description: Validation Error
