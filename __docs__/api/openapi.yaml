openapi: 3.1.0
info:
  title: Agonez Atlas API
  description: REST API for the Agonez exercise and muscle Atlas and the relational PlanCreator draft editor. Authentication and ownership are intentionally deferred in this first PlanCreator iteration.
  version: 0.1.0
paths:
  /assets/anatomy.svg:
    get:
      tags:
      - Atlas
      summary: Anatomy Asset
      operationId: anatomy_asset_assets_anatomy_svg_get
      responses:
        '200':
          description: Successful Response
        '404':
          description: Anatomy asset has not been installed
  /api/atlas/exercises:
    get:
      tags:
      - Atlas
      summary: List Exercises
      operationId: list_exercises_api_atlas_exercises_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 255
          - type: 'null'
          title: Q
      - name: body_part
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Body Part
      - name: target_category
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Target Category
      - name: mechanics_tier
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Mechanics Tier
      - name: resistance_source
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Resistance Source
      - name: sort
        in: query
        required: false
        schema:
          enum:
          - name
          - name_full
          - load_capacity
          - systemic_propulsive_fcsa_demand
          - created_at
          - updated_at
          type: string
          default: name
          title: Sort
      - name: order
        in: query
        required: false
        schema:
          enum:
          - asc
          - desc
          type: string
          default: asc
          title: Order
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Per Page
      - name: Accept-Language
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Accept-Language
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/atlas/exercises/catalog:
    get:
      tags:
      - Atlas
      summary: List Exercise Catalog
      operationId: list_exercise_catalog_api_atlas_exercises_catalog_get
      parameters:
      - name: Accept-Language
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Accept-Language
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseCatalogResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/atlas/exercises/{slug}:
    get:
      tags:
      - Atlas
      summary: Get Exercise
      operationId: get_exercise_api_atlas_exercises__slug__get
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[a-z0-9]+(?:_[a-z0-9]+)*$
          title: Slug
      - name: Accept-Language
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Accept-Language
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/atlas/exercises/{slug}/videos:
    post:
      tags:
      - Atlas
      summary: Add Exercise Video
      operationId: add_exercise_video_api_atlas_exercises__slug__videos_post
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[a-z0-9]+(?:_[a-z0-9]+)*$
          title: Slug
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExerciseVideoCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseVideoLinks'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/atlas/muscles:
    get:
      tags:
      - Atlas
      summary: List Muscles
      operationId: list_muscles_api_atlas_muscles_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 255
          - type: 'null'
          title: Q
      - name: body_part
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Body Part
      - name: complex
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Complex
      - name: sort
        in: query
        required: false
        schema:
          enum:
          - name
          - mass_g
          - mv_cm3
          - fiber_bias_type_ii
          - pcsa_fiber_cm2
          - pcsa_projected_fcsa_cm2
          type: string
          default: name
          title: Sort
      - name: order
        in: query
        required: false
        schema:
          enum:
          - asc
          - desc
          type: string
          default: asc
          title: Order
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Per Page
      - name: Accept-Language
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Accept-Language
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MuscleListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/atlas/muscles/{slug}/exercises:
    get:
      tags:
      - Atlas
      summary: Get Related Exercises
      operationId: get_related_exercises_api_atlas_muscles__slug__exercises_get
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[a-z0-9]+(?:_[a-z0-9]+)*$
          title: Slug
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 8
          title: Limit
      - name: sort
        in: query
        required: false
        schema:
          enum:
          - etu
          - name
          type: string
          default: etu
          title: Sort
      - name: Accept-Language
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Accept-Language
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelatedExerciseResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/atlas/muscles/{slug}:
    get:
      tags:
      - Atlas
      summary: Get Muscle
      operationId: get_muscle_api_atlas_muscles__slug__get
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[a-z0-9]+(?:_[a-z0-9]+)*$
          title: Slug
      - name: Accept-Language
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Accept-Language
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MuscleDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/atlas/meta:
    get:
      tags:
      - Atlas
      summary: Get Meta
      operationId: get_meta_api_atlas_meta_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasMeta'
  /api/plans:
    get:
      tags:
      - Plans
      summary: List Plans
      operationId: list_plans_api_plans_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanListResponse'
    post:
      tags:
      - Plans
      summary: Create Plan
      operationId: create_plan_api_plans_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDraftArtifact'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/plans/import:
    post:
      tags:
      - Plans
      summary: Import Plan
      operationId: import_plan_api_plans_import_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanAIImportDocument'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDraftArtifact'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/plans/catalog/progression-models:
    get:
      tags:
      - Plans
      summary: List Progression Models
      operationId: list_progression_models_api_plans_catalog_progression_models_get
      parameters:
      - name: Accept-Language
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Accept-Language
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressionModelCatalogResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/plans/{plan_id}/duplicate:
    post:
      tags:
      - Plans
      summary: Duplicate Plan
      operationId: duplicate_plan_api_plans__plan_id__duplicate_post
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          title: Plan Id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDraftArtifact'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/plans/{plan_id}:
    get:
      tags:
      - Plans
      summary: Get Plan
      operationId: get_plan_api_plans__plan_id__get
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          title: Plan Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Plans
      summary: Delete Plan
      operationId: delete_plan_api_plans__plan_id__delete
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          title: Plan Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/plans/{plan_id}/draft:
    get:
      tags:
      - Plans
      summary: Get Draft
      operationId: get_draft_api_plans__plan_id__draft_get
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          title: Plan Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDraftArtifact'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Plans
      summary: Save Draft
      operationId: save_draft_api_plans__plan_id__draft_put
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          title: Plan Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanDraftUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDraftArtifact'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/plans/{plan_id}/draft/analysis:
    post:
      tags:
      - Plans
      summary: Analyze Draft
      operationId: analyze_draft_api_plans__plan_id__draft_analysis_post
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          title: Plan Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanAnalysisRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanAnalysisResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/plans/{plan_id}/draft/export:
    post:
      tags:
      - Plans
      summary: Export Draft
      operationId: export_draft_api_plans__plan_id__draft_export_post
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          title: Plan Id
      - name: Accept-Language
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Accept-Language
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanExportRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanAIExportResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AnalysisDiagnostic:
      properties:
        code:
          type: string
          title: Code
        severity:
          $ref: '#/components/schemas/DiagnosticSeverity'
        message:
          type: string
          title: Message
        exercise_slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Exercise Slug
        affected_muscle_slugs:
          items:
            type: string
          type: array
          title: Affected Muscle Slugs
        affected_joint_slugs:
          items:
            type: string
          type: array
          title: Affected Joint Slugs
      additionalProperties: false
      type: object
      required:
      - code
      - severity
      - message
      title: AnalysisDiagnostic
    AnalysisModelParameters:
      properties:
        microcycle_days:
          type: integer
          minimum: 0.0
          title: Microcycle Days
        microcycle_hours:
          type: number
          minimum: 0.0
          title: Microcycle Hours
        microcycle_weeks:
          type: number
          minimum: 0.0
          title: Microcycle Weeks
        weekly_normalization_factor:
          type: number
          minimum: 0.0
          title: Weekly Normalization Factor
        effective_reps_by_rir:
          additionalProperties:
            type: number
          type: object
          title: Effective Reps By Rir
        rir_recovery_multiplier:
          additionalProperties:
            type: number
          type: object
          title: Rir Recovery Multiplier
        cumulative_set_penalty_step:
          type: number
          title: Cumulative Set Penalty Step
        cumulative_set_penalty_cap:
          type: number
          title: Cumulative Set Penalty Cap
        meaningful_contribution_epsilon:
          type: number
          title: Meaningful Contribution Epsilon
        recovery_convergence_epsilon_hours:
          type: number
          title: Recovery Convergence Epsilon Hours
        recovery_max_cycles:
          type: integer
          title: Recovery Max Cycles
        muscle_recovery_velocity_v1:
          type: number
          title: Muscle Recovery Velocity V1
        joint_recovery_velocity_v1:
          type: number
          title: Joint Recovery Velocity V1
      additionalProperties: false
      type: object
      required:
      - microcycle_days
      - microcycle_hours
      - microcycle_weeks
      - weekly_normalization_factor
      - effective_reps_by_rir
      - rir_recovery_multiplier
      - cumulative_set_penalty_step
      - cumulative_set_penalty_cap
      - meaningful_contribution_epsilon
      - recovery_convergence_epsilon_hours
      - recovery_max_cycles
      - muscle_recovery_velocity_v1
      - joint_recovery_velocity_v1
      title: AnalysisModelParameters
    AnalysisTimelineDay:
      properties:
        day_id:
          type: integer
          title: Day Id
        day_ordinal:
          type: integer
          title: Day Ordinal
        day_name:
          type: string
          title: Day Name
        weekday:
          anyOf:
          - type: integer
          - type: 'null'
          title: Weekday
        hour_offset:
          type: number
          title: Hour Offset
        elapsed_hours_since_previous_entry:
          type: number
          title: Elapsed Hours Since Previous Entry
        workout:
          anyOf:
          - $ref: '#/components/schemas/TimelineWorkout'
          - type: 'null'
        muscle_recovery_before:
          items:
            $ref: '#/components/schemas/RecoveryState'
          type: array
          title: Muscle Recovery Before
        muscle_recovery_after:
          items:
            $ref: '#/components/schemas/RecoveryState'
          type: array
          title: Muscle Recovery After
        joint_recovery_before:
          items:
            $ref: '#/components/schemas/RecoveryState'
          type: array
          title: Joint Recovery Before
        joint_recovery_after:
          items:
            $ref: '#/components/schemas/RecoveryState'
          type: array
          title: Joint Recovery After
      additionalProperties: false
      type: object
      required:
      - day_id
      - day_ordinal
      - day_name
      - weekday
      - hour_offset
      - elapsed_hours_since_previous_entry
      - workout
      - muscle_recovery_before
      - muscle_recovery_after
      - joint_recovery_before
      - joint_recovery_after
      title: AnalysisTimelineDay
    AtlasCounts:
      properties:
        exercises:
          type: integer
          title: Exercises
        muscles:
          type: integer
          title: Muscles
      additionalProperties: false
      type: object
      required:
      - exercises
      - muscles
      title: AtlasCounts
    AtlasMeta:
      properties:
        body_part:
          items:
            type: string
          type: array
          title: Body Part
        target_category:
          items:
            type: string
          type: array
          title: Target Category
        mechanics_tier:
          items:
            type: string
          type: array
          title: Mechanics Tier
        resistance_source:
          items:
            type: string
          type: array
          title: Resistance Source
        muscle_complex:
          items:
            type: string
          type: array
          title: Muscle Complex
        counts:
          $ref: '#/components/schemas/AtlasCounts'
      additionalProperties: false
      type: object
      required:
      - body_part
      - target_category
      - mechanics_tier
      - resistance_source
      - muscle_complex
      - counts
      title: AtlasMeta
    DayArtifact:
      properties:
        id:
          type: integer
          title: Id
        ordinal:
          type: integer
          title: Ordinal
        weekday:
          anyOf:
          - type: integer
          - type: 'null'
          title: Weekday
        name:
          type: string
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        workout_unit:
          anyOf:
          - $ref: '#/components/schemas/WorkoutUnitArtifact'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - id
      - ordinal
      - weekday
      - name
      - description
      - workout_unit
      title: DayArtifact
    DayDraft:
      properties:
        id:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Id
        ordinal:
          type: integer
          minimum: 0.0
          title: Ordinal
        weekday:
          anyOf:
          - type: integer
            maximum: 7.0
            minimum: 1.0
          - type: 'null'
          title: Weekday
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        workout_unit:
          anyOf:
          - $ref: '#/components/schemas/WorkoutUnitDraft'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - ordinal
      - name
      title: DayDraft
    DiagnosticSeverity:
      type: string
      enum:
      - INFO
      - WARNING
      - ERROR
      title: DiagnosticSeverity
    ExerciseCatalogItem:
      properties:
        slug:
          type: string
          title: Slug
        name:
          type: string
          title: Name
        name_full:
          type: string
          title: Name Full
        target_category:
          type: string
          title: Target Category
        mechanics_tier:
          type: string
          title: Mechanics Tier
        resistance_source:
          type: string
          title: Resistance Source
        systemic_propulsive_fcsa_demand:
          anyOf:
          - type: number
          - type: 'null'
          title: Systemic Propulsive Fcsa Demand
        recommended_rep_profile:
          $ref: '#/components/schemas/RecommendedRepProfile'
        image_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Url
      additionalProperties: false
      type: object
      required:
      - slug
      - name
      - name_full
      - target_category
      - mechanics_tier
      - resistance_source
      - systemic_propulsive_fcsa_demand
      - recommended_rep_profile
      - image_url
