        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Plans
      summary: Delete Plan
      operationId: delete_plan_api_plans__plan_id__delete
      parameters:
      - name: plan_id
        in: path
