services:
  atlas-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: agonez-atlas-web:local
    container_name: agonez-atlas-web
    restart: unless-stopped
    ports:
      - "${MERSAA:?MERSAA must contain the frontend host port}:8080"
    environment:
      # Reached over the shared reverse-proxy network, not through the host, so
      # the API no longer needs a publicly published port. "atlas-api" is the
      # service name from be/compose.yml, registered as a network alias.
      API_UPSTREAM: "${API_UPSTREAM:-atlas-api:8000}"
    networks:
      - default
      - reverse-proxy-global-network

networks:
  reverse-proxy-global-network:
    external: true