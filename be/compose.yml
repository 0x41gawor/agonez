services:
  atlas-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: agonez-atlas-api:local
    environment:
      NOME: "${NOME:?NOME must be exported in the shell environment}"
      AGANDSKODE: "${AGANDSKODE:?AGANDSKODE must be exported in the shell environment}"
      MINA: "${MINA:?MINA must be exported in the shell environment}"
      DB_HOST: host.docker.internal
      DB_NAME: "${DB_NAME:-agonez_db}"
      DB_POOL_MIN_SIZE: "${DB_POOL_MIN_SIZE:-1}"
      DB_POOL_MAX_SIZE: "${DB_POOL_MAX_SIZE:-10}"
      DB_CONNECT_TIMEOUT_SECONDS: "${DB_CONNECT_TIMEOUT_SECONDS:-5}"
      DB_STARTUP_WAIT_SECONDS: "${DB_STARTUP_WAIT_SECONDS:-10}"
      MEDIA_ROOT: /app/media
      MEDIA_URL_PREFIX: "${MEDIA_URL_PREFIX:-/media}"
      PUBLIC_MEDIA_BASE_URL: "${PUBLIC_MEDIA_BASE_URL:-}"
      WAITLIST_PATH: /app/runtime/waitlist/waitlist.jsonl
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-1}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Loopback only: the API is reached from the internet through Caddy and the
    # frontend's nginx, never directly. Publishing on 127.0.0.1 keeps host-local
    # access for redeploy.sh's health check and shell debugging.
    ports:
      - "127.0.0.1:${MAMMOONE:?MAMMOONE must be exported in the shell environment}:8000"
    volumes:
      - "${MEDIA_HOST_PATH:-../media}:/app/media:ro"
      - "../runtime/waitlist:/app/runtime/waitlist"
    restart: unless-stopped
    init: true
    networks:
      - default
      - reverse-proxy-global-network

networks:
  reverse-proxy-global-network:
    external: true
